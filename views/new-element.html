<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Añadir álbum | MUSIX</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="/styles/style.css" rel="stylesheet">
</head>

<body>
    {{>header}}
    <main class="page-background">
        <div class="container py-5">
            <div class="row mb-5">
                <div class="col-12 text-center">
                    <h1 class="page-title">Añadir un nuevo álbum</h1>
                    <p class="page-subtitle">Rellena el formulario para añadir un nuevo álbum</p>
                </div>
            </div>
            <div class="form-panel">
                <!-- Album fields: label for matches input id; name identifies the submitted value. -->
                <form class="form-surface" id="album-form">
                    <div class="row mb-3">
                        <div class="col-12">
                            <label class="form-label" for="album-title">Álbum</label>
                            <input class="form-control" id="album-title" name="album_title" placeholder="Álbum title"
                                required type="text">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="record-price">Precio</label>
                            <input class="form-control" id="record-price" min="0" name="record_price"
                                placeholder="Álbum price" required step="0.01" type="number">
                        </div>
                        <div class="col-12 col-md-6">
                            <label class="form-label" for="artist">Artista</label>
                            <input class="form-control" id="artist" name="artist" placeholder="Artista name" required
                                type="text">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-12">
                            <label class="form-label" for="cover-image">Álbum cover</label>
                            <input accept="image/*" class="form-control" id="cover-image" name="cover_image" required
                                type="file">
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="release-date">Fecha de lanzamiento</label>
                            <input class="form-control" id="release-date" name="release_date" required type="date">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <div class="col-12">
                            <label class="form-label" for="description">Descripción</label>
                            <textarea class="form-control" id="description" name="description"
                                placeholder="Álbum description" required rows="4"></textarea>
                        </div>
                        <div class="col-12">
                            <label class="form-label" for="format">Formato</label>
                            <!-- Keep these choices consistent with the shared header. -->
                            <select class="form-select" id="format" name="format" required>
                                <option value="lp">LP</option>
                                <option selected value="vinyl">Vinilo</option>
                                <option value="digital">Digital</option>
                                <option value="cd">CD</option>
                            </select>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-12 d-flex justify-content-between gap-2 flex-wrap">
                            <a class="button" href="/">Cancelar</a>
                            <!-- Static in phase 1; form submission belongs to phase 2. -->
                            <button class="button" type="button">Guardar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
    {{>footer}}
</body>

</html>
